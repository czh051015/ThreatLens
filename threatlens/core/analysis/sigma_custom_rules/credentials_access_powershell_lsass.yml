# 02 §5.6 / ADR-003 决策 2：自定义规则（非官方 Sigma 社区库，仅 demo 链准入）。
#
# 背景：官方 Sigma 对 demo 链 T1003.001 无命中——mimikatz 数据集是 Empire 内存注入
# 执行（无任何 mimikatz 磁盘关键词），唯一攻击证据是 powershell.exe → lsass.exe
# 进程访问（GrantedAccess 0x1010 = PROCESS_VM_READ | PROCESS_QUERY_INFORMATION，
# 即 sekurlsa::logonpasswords 读取 lsass 内存）；而官方 proc_access_win_lsass_memdump.yml
# 恰好把 0x1010 注释为误报排除。
#
# 实测（2026-08-31）：本规则在 4 数据集 9050 事件中唯一命中
# empire_mimikatz_logonpasswords_2020-08-07103224.json:2451，零误报。
title: PowerShell Accessing LSASS Memory (curated custom rule)
status: custom
description: >-
  PowerShell opens a handle to LSASS with read access
  (0x1010 = PROCESS_VM_READ | PROCESS_QUERY_INFORMATION) - in-memory
  credential dumping (Empire mimikatz). Custom rule for the demo chain,
  NOT part of the official Sigma community library.
tags:
  - attack.credential-access
  - attack.t1003.001
logsource:
  category: process_access
  product: windows
detection:
  selection:
    SourceImage|endswith: '\powershell.exe'
    TargetImage|endswith: '\lsass.exe'
  condition: selection
